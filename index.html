<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="On-device LLM chat that runs on CPU (WASM) — no WebGPU, no server, works offline after the first model download.">
<title>Pocket Chat — Offline LLM</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Modern minimalist, Kheti family tokens: ink / paper / gold, Georgia display. */
  :root {
    --ink:#173d2b; --ink-2:#28533c; --paper:#fffdf8; --bg:#ffffff;
    --gold:#e5a83b; --gold-soft:#faf3dd; --line:#e8e2d3; --line-soft:#f0ece1;
    --muted:#7a847b; --text:#1d2b23; --red:#a84e38; --green:#2e7d4f;
    --radius:18px; --shadow:0 8px 30px rgba(23,61,43,.08);
    --ease:cubic-bezier(.22,1,.36,1);
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.6;
    display: flex; flex-direction: column; height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  button, textarea { font: inherit; }
  button { cursor: pointer; }

  /* ---- Slim sticky header ---- */
  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--line-soft);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
  .mark {
    height: 34px; width: 34px; border-radius: 11px; background: var(--gold);
    display: grid; place-items: center; font-size: 17px; flex: 0 0 auto;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.08);
  }
  .brand-text { min-width: 0; }
  .brand-text strong { display: block; font-family: Georgia, serif; font-size: 17px; letter-spacing: -.01em; line-height: 1.15; color: var(--ink); }
  .brand-text span { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
    font-size: 12px; font-weight: 600; color: var(--ink-2);
    padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--paper); max-width: 46vw; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex: 0 0 auto; }
  .pill.loading .dot { animation: pulse 1.2s ease-in-out infinite; }
  .pill.ready .dot { background: var(--green); animation: none; }
  .pill.error .dot { background: var(--red); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .icon-btn {
    flex: 0 0 auto; height: 36px; min-width: 36px; padding: 0 10px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--paper);
    color: var(--ink); font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .16s var(--ease), box-shadow .16s var(--ease), background-color .16s var(--ease);
  }
  .icon-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .icon-btn:active { transform: translateY(0) scale(.97); }
  .icon-btn.on { background: var(--gold); border-color: var(--gold); }
  .icon-btn:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }

  /* Thin progress hairline under the header; only visible while loading. */
  #progressWrap { height: 2px; background: transparent; flex: 0 0 auto; display: none; }
  #progressBar { height: 100%; width: 0%; background: var(--gold); transition: width .2s var(--ease); }

  /* ---- Chat column ---- */
  #chat { flex: 1 1 auto; overflow-y: auto; padding: 20px 16px 16px; scroll-behavior: smooth; }
  .col { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; animation: rise .25s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 10px 15px; border-radius: var(--radius);
    background: var(--ink); color: #f6f2e9; border-bottom-right-radius: 6px;
    line-height: 1.55; white-space: pre-wrap; word-wrap: break-word;
  }
  .bubble img { max-width: 100%; border-radius: 12px; display: block; margin-bottom: 8px; }
  .row.assistant { gap: 10px; align-items: flex-start; }
  .avatar {
    width: 28px; height: 28px; border-radius: 9px; background: var(--gold);
    display: grid; place-items: center; font-size: 14px; flex: 0 0 auto; margin-top: 2px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.08);
  }
  .assistant-body { min-width: 0; flex: 1 1 auto; padding-top: 3px; }
  .msg-text { line-height: 1.65; word-wrap: break-word; }
  .msg-text p { margin: 0 0 10px; } .msg-text p:last-child { margin-bottom: 0; }
  .msg-text ul { margin: 0 0 10px; padding-left: 20px; } .msg-text li { margin: 3px 0; }
  .msg-text code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; background: var(--line-soft); padding: 2px 6px; border-radius: 6px; }
  .msg-text pre { background: var(--line-soft); padding: 12px 14px; border-radius: 12px; overflow-x: auto; margin: 0 0 10px; }
  .msg-text pre code { background: none; padding: 0; }
  .caret { display: inline-block; width: 8px; height: 1.05em; background: var(--gold); border-radius: 2px; vertical-align: text-bottom; margin-left: 2px; animation: pulse 1s ease-in-out infinite; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .msg-actions { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
  .ghost-btn {
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
    border: 1px solid transparent; background: transparent; color: var(--muted);
    transition: background-color .16s var(--ease), color .16s var(--ease);
  }
  .ghost-btn:hover { background: var(--line-soft); color: var(--ink); }
  .ghost-btn:disabled { opacity: .5; }
  .ghost-btn.speaking { background: var(--gold-soft); color: var(--ink); }

  /* Error card */
  #errorBox {
    display: none; margin: 0 auto 16px; max-width: 720px; padding: 14px 16px;
    background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--red);
    border-radius: var(--radius); font-size: 13px; line-height: 1.55; white-space: pre-wrap;
  }
  #retryRow { display: none; gap: 8px; margin: 0 auto 16px; max-width: 720px; flex-wrap: wrap; }
  .btn {
    font-size: 14px; font-weight: 700; padding: 10px 16px; border-radius: 12px;
    border: 0; background: var(--ink); color: #fff;
    transition: transform .16s var(--ease), box-shadow .16s var(--ease);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn.secondary { background: var(--gold-soft); color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }

  /* ---- Empty state ---- */
  #emptyState { text-align: center; padding: 9vh 12px 0; }
  #emptyState .mark { height: 56px; width: 56px; border-radius: 18px; font-size: 28px; margin: 0 auto 18px; }
  #emptyState h1 { font-family: Georgia, serif; font-size: clamp(26px, 5vw, 34px); letter-spacing: -.02em; margin: 0 0 8px; color: var(--ink); font-weight: 600; }
  #emptyState p { color: var(--muted); margin: 0 auto 22px; max-width: 420px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    transition: transform .16s var(--ease), box-shadow .16s var(--ease), border-color .16s var(--ease);
  }
  .chip:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: var(--gold); }

  /* ---- Floating composer ---- */
  .composer-wrap { flex: 0 0 auto; padding: 8px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); }
  .composer { max-width: 720px; margin: 0 auto; }
  form {
    display: flex; align-items: flex-end; gap: 6px; padding: 8px 8px 8px 12px;
    border: 1px solid var(--line); border-radius: 24px; background: var(--paper);
    box-shadow: var(--shadow);
    transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  form:focus-within { border-color: var(--ink-2); box-shadow: 0 0 0 3px rgba(40,83,60,.1), var(--shadow); }
  form textarea {
    flex: 1 1 auto; border: 0; outline: none; resize: none; background: transparent;
    color: var(--text); font-size: 16px; line-height: 1.5; padding: 7px 2px;
    max-height: 160px; min-height: 24px;
  }
  form textarea::placeholder { color: var(--muted); }
  form textarea:disabled { opacity: .55; }
  .composer-btn {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; border: 0;
    background: transparent; color: var(--ink); font-size: 17px;
    display: grid; place-items: center;
    transition: transform .16s var(--ease), background-color .16s var(--ease);
  }
  .composer-btn:hover { background: var(--line-soft); }
  .composer-btn:active { transform: scale(.94); }
  #sendBtn { background: var(--ink); color: #fff; font-size: 15px; }
  #sendBtn:hover { background: var(--ink-2); }
  #sendBtn.stop { background: var(--red); }
  #sendBtn:disabled { opacity: .4; }
  .caption { text-align: center; font-size: 11px; color: var(--muted); margin: 8px 0 0; }

  /* Toast (voice / photo notices — never overwrites the model status pill) */
  #toast {
    position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 8px);
    background: var(--ink); color: #f6f2e9; font-size: 13px; font-weight: 600;
    padding: 9px 16px; border-radius: 999px; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity .2s var(--ease), transform .2s var(--ease);
    max-width: 88vw; text-align: center; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 560px) {
    .brand-text span { display: none; }
    .pill { max-width: 34vw; }
    #voiceToggle .lbl { display: none; }
    #newChatBtn .lbl { display: none; }
    .bubble { max-width: 88%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#101a14; --paper:#182720; --ink:#dcead9; --ink-2:#b9d2bd;
      --text:#e8efe9; --line:#2c4636; --line-soft:#223729; --muted:#9db3a4;
      --gold-soft:#3d2f10; --green:#7fc89b;
    }
    .bubble { background: #28533c; }
    .brand-text strong { color: #e8efe9; }
    #sendBtn { background: #e5a83b; color: #173d2b; }
    #sendBtn:hover { background: #f2c46d; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true">✦</div>
    <div class="brand-text">
      <strong>Pocket Chat</strong>
      <span>MNN-Pocket 0.3B · on-device</span>
    </div>
  </div>
  <span class="pill loading" id="statusPill" role="status"><span class="dot"></span><span id="statusText">Checking saved model…</span></span>
  <button id="voiceToggle" type="button" class="icon-btn" title="Read replies aloud (Phonon voice)">🔊 <span class="lbl">Voice</span></button>
  <button id="newChatBtn" type="button" class="icon-btn" title="Start a new chat">＋ <span class="lbl">New</span></button>
</header>
<div id="progressWrap"><div id="progressBar"></div></div>

<main id="chat" aria-live="polite">
  <div class="col" id="chatCol">
    <div id="errorBox" role="alert"></div>
    <div id="retryRow">
      <button id="retryBtn" type="button" class="btn">Retry download</button>
      <button id="clearBtn" type="button" class="btn secondary">Clear cached model &amp; retry</button>
    </div>
    <div id="emptyState">
      <div class="mark" aria-hidden="true">✦</div>
      <h1>How can I help?</h1>
      <p>Runs entirely on your device — no server, no WebGPU. After the first download it works offline.</p>
      <div class="chips">
        <button type="button" class="chip" data-prompt="Explain photosynthesis in two short lines.">Explain photosynthesis</button>
        <button type="button" class="chip" data-prompt="Write a haiku about rain in Punjab.">A haiku about rain</button>
        <button type="button" class="chip" data-prompt="Give me 3 simple ideas for a healthy vegetarian lunch.">Healthy lunch ideas</button>
      </div>
    </div>
  </div>
</main>

<div class="composer-wrap">
  <div class="composer">
    <form id="chatForm">
      <button id="photoBtn" type="button" class="composer-btn" title="Attach a photo — Mirage describes it, then the chat model answers about it" aria-label="Attach a photo">📷</button>
      <input id="photoInput" type="file" accept="image/*" hidden>
      <textarea id="input" rows="1" placeholder="Ask anything…" autocomplete="off" disabled aria-label="Message"></textarea>
      <button id="sendBtn" type="submit" disabled aria-label="Send">↑</button>
    </form>
    <p class="caption">MNN-Pocket 0.3B · Mirage vision · CPU/WASM only · Voice: Phonon 31M</p>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
// Surface module-load failures (e.g. a dead CDN import) in the status pill
// instead of leaving the page silently stuck.
window.addEventListener('error', (e) => {
  if (e.target === window && /import|module|wllama/i.test(e.message || '')) {
    // NOTE: setStatus lives in the module script below, not in global scope,
    // so this classic-script handler must touch the DOM directly.
    const pill = document.getElementById('statusPill');
    const s = document.getElementById('statusText');
    if (s && !window.__wllamaBooted) {
      s.textContent = 'Failed to load runtime: ' + e.message;
      if (pill) pill.className = 'pill error';
    }
  }
}, true);
</script>
<script type="module">
import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/esm/index.js';
window.__wllamaBooted = true;
// wllama's wasm lives at this path in the published package (single wasm;
// single- vs multi-thread is chosen at runtime based on COOP/COEP headers).
const CONFIG_PATHS = {
  default: 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/src/wasm/wllama.wasm',
};

const MODEL_URL = 'https://huggingface.co/taobao-mnn/MNN-Pocket-0.3B-GGUF/resolve/main/MNN-Pocket-0.3B-Instruct-Q4_1.gguf';
const MODEL_FILE = MODEL_URL.split('/').pop();
const statusPill = document.getElementById('statusPill');
const statusText = document.getElementById('statusText');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const errorBox = document.getElementById('errorBox');
const retryRow = document.getElementById('retryRow');
const retryBtn = document.getElementById('retryBtn');
const clearBtn = document.getElementById('clearBtn');
const chatEl = document.getElementById('chat');
const chatCol = document.getElementById('chatCol');
const emptyState = document.getElementById('emptyState');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const toastEl = document.getElementById('toast');

let wllama = null;
let loading = false;
let generating = false;
let stopRequested = false;
const history = [{ role: 'system', content: 'You are a helpful assistant. Keep answers concise.' }];

/* ---- Status pill + toast (separate: voice/photo notices must never
   overwrite the model status) ---- */
let toastTimer = null;
function setStatus(t, kind = 'loading') {
  statusText.textContent = t;
  statusPill.title = t;
  statusPill.className = 'pill ' + kind;
}
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

/* ---- Safe minimal markdown for assistant replies (escape first) ---- */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function renderMarkdown(text) {
  const codeBlocks = [];
  let html = escapeHtml(text);
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push('<pre><code>' + code.replace(/^\n/, '') + '</code></pre>');
    return '\u0000' + (codeBlocks.length - 1) + '\u0000';
  });
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  const lines = html.split('\n');
  let out = '', inList = false, para = [];
  const flushPara = () => { if (para.length) { out += '<p>' + para.join('<br>') + '</p>'; para = []; } };
  for (const line of lines) {
    const m = line.match(/^\s*[-•]\s+(.*)$/);
    if (m) {
      if (!inList) { flushPara(); out += '<ul>'; inList = true; }
      out += '<li>' + m[1] + '</li>';
    } else {
      if (inList) { out += '</ul>'; inList = false; }
      if (line.trim() === '') flushPara(); else para.push(line);
    }
  }
  if (inList) out += '</ul>';
  flushPara();
  return out.replace(/\u0000(\d+)\u0000/g, (_, i) => codeBlocks[+i] || '');
}

/* ---- Chat rendering: only autoscroll when the user is already at the bottom ---- */
function nearBottom() { return chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 80; }
function scrollIfNearBottom() { if (nearBottom()) chatEl.scrollTop = chatEl.scrollHeight; }
function hideEmptyState() { if (emptyState) emptyState.style.display = 'none'; }

function addUserMsg(text) {
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'row user';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  chatCol.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return row;
}
function addAssistantMsg(text) {
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'row assistant';
  const av = document.createElement('div');
  av.className = 'avatar'; av.textContent = '✦'; av.setAttribute('aria-hidden', 'true');
  const body = document.createElement('div');
  body.className = 'assistant-body';
  const txt = document.createElement('div');
  txt.className = 'msg-text';
  txt.innerHTML = renderMarkdown(text);
  body.appendChild(txt);
  row.appendChild(av); row.appendChild(body);
  chatCol.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return { row, body, textEl: txt };
}
function attachReplyActions(body, rawText) {
  const meta = document.createElement('div');
  meta.className = 'meta';
  body.appendChild(meta);
  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  const copyBtn = document.createElement('button');
  copyBtn.type = 'button'; copyBtn.className = 'ghost-btn'; copyBtn.textContent = 'Copy';
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(rawText); copyBtn.textContent = 'Copied ✓'; }
    catch (e) { copyBtn.textContent = 'Copy failed'; }
    setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
  });
  const speakBtn = document.createElement('button');
  speakBtn.type = 'button'; speakBtn.className = 'ghost-btn'; speakBtn.textContent = '🔊 Read aloud';
  speakBtn.addEventListener('click', () => speakReply(rawText, speakBtn));
  const regenBtn = document.createElement('button');
  regenBtn.type = 'button'; regenBtn.className = 'ghost-btn'; regenBtn.textContent = '↻ Regenerate';
  regenBtn.addEventListener('click', () => regenerateLast());
  actions.append(copyBtn, speakBtn, regenBtn);
  body.appendChild(actions);
  return { meta, speakBtn };
}

/* ---- Chat persistence (text only; photo context is session-only) ---- */
const SAVED_KEY = 'llmchat.saved.v1';
let savedMsgs = [];
try { savedMsgs = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'); } catch (e) { savedMsgs = []; }
function saveChat() {
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(savedMsgs.slice(-40))); } catch (e) {}
}
function restoreChat() {
  if (!savedMsgs.length) return;
  for (const m of savedMsgs.slice(-40)) {
    if (m.role === 'user') addUserMsg(m.text);
    else if (m.role === 'assistant') {
      const { body } = addAssistantMsg(m.text);
      attachReplyActions(body, m.text);
      history.push({ role: 'assistant', content: m.text });
    }
  }
  // Rebuild model history in order (user turns were pushed below in order).
  const rebuilt = [{ role: 'system', content: history[0].content }];
  for (const m of savedMsgs.slice(-40)) rebuilt.push({ role: m.role, content: m.text });
  history.length = 0; history.push(...rebuilt);
}
restoreChat();

/* ---- Read aloud: Phonon 31M natural voice (vendored runtime) ---- */
// Same engine as Mind Gym: PhononTTS.load downloads the voice once and
// caches it in the Cache API ('phonon-tts-v1', origin-scoped, so the copy
// Mind Gym already downloaded on this origin is reused — no re-download).
// The runtime is vendored (./vendor/phonon-tts/) instead of a CDN import:
// phonon-tts resolves its worker + wasm relative to its own files, and
// same-origin keeps that resolution trivial. If Phonon fails to load, the
// button falls back to the device voice so it always does something.
// FIX (Nov 14 redesign): loadPhonon used to call setStatus(), overwriting
// the model status ("Model ready") with voice chatter. It now only toasts.
let tts = null, phononVoice = null, phononFailed = false;
let phononAudio = null, phononGain = null;
let activeSources = [], lastEnd = 0;
const ttsRate = 1;
let speakingRun = null; // { cancelled, abort, btn }
let speakSeq = 0; // bumped by stopSpeaking; a pending voice load checks it

function ensurePhononAudio() {
  if (!phononAudio) {
    phononAudio = new (window.AudioContext || window.webkitAudioContext)();
    phononGain = phononAudio.createGain(); phononGain.gain.value = 1;
    phononGain.connect(phononAudio.destination);
  }
  if (phononAudio.state === 'suspended') phononAudio.resume();
}

async function loadPhonon() {
  if (tts || phononFailed) return tts;
  ensurePhononAudio();
  showToast('Preparing natural voice…');
  try {
    const { PhononTTS } = await import('./vendor/phonon-tts/index.js');
    tts = await PhononTTS.load({ lang: 'en', device: 'auto', quant: 'q8',
      onProgress: ({ loaded, total, cached }) => {
        if (!cached && total) showToast(`Preparing natural voice… ${Math.round((loaded / total) * 100)}%`);
      } });
    phononVoice = tts.voices[0];
    showToast('Natural voice ready · offline from now on');
    return tts;
  } catch (e) {
    console.error('Phonon load failed, falling back to device voice', e);
    phononFailed = true;
    showToast('Natural voice unavailable — using the device voice.');
    return null;
  }
}

function speakDevice(text) {
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window)) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = ttsRate;
    let done = false;
    const fin = () => { if (!done) { done = true; resolve(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, Math.max(3000, text.length * 95 / ttsRate + 2500));
    try { speechSynthesis.speak(u); } catch (e) { fin(); }
  });
}

async function speakPhonon(text, run) {
  ensurePhononAudio();
  lastEnd = 0; // FIX: was a stale global across runs — old cursor could start playback in the past / overlap the previous reply.
  const parts = text.match(/[^.!?]+[.!?]+["']?|\S[^.!?]*$/g)?.map((s) => s.trim()).filter(Boolean) || [text];
  try {
    for (const part of parts) {
      if (run.cancelled) break;
      const stream = tts.stream(part, { voice: phononVoice, signal: run.abort.signal });
      let cursor = Math.max(phononAudio.currentTime, lastEnd);
      for await (const pcm of stream) {
        if (run.cancelled) break;
        const buf = phononAudio.createBuffer(1, pcm.length, tts.sampleRate);
        buf.getChannelData(0).set(pcm);
        const src = phononAudio.createBufferSource();
        src.buffer = buf; src.playbackRate.value = ttsRate; src.connect(phononGain);
        activeSources.push(src);
        src.onended = () => { const i = activeSources.indexOf(src); if (i >= 0) activeSources.splice(i, 1); };
        cursor = Math.max(cursor, phononAudio.currentTime);
        src.start(cursor); cursor += buf.duration / ttsRate;
      }
      await stream.done.catch(() => {});
      lastEnd = cursor;
      const waitMs = Math.max(0, (cursor - phononAudio.currentTime) * 1000);
      await new Promise((r) => setTimeout(r, waitMs + 250));
      if (run.cancelled) break;
    }
  } catch (e) { if (!run.cancelled) console.error(e); }
}

function stopSpeaking() {
  speakSeq++;
  if (speakingRun) { speakingRun.cancelled = true; speakingRun.abort.abort(); }
  try { speechSynthesis.cancel(); } catch (e) {}
  activeSources.splice(0).forEach((s) => { try { s.stop(); } catch (e) {} });
  // FIX: voiceToggle used to share the .ghost-btn/.speak-btn class, so this
  // reset could rewrite the header toggle's label. Reply buttons are now
  // .ghost-btn only; the toggle is .icon-btn and is never touched here.
  document.querySelectorAll('.ghost-btn.speaking').forEach((b) => {
    b.classList.remove('speaking'); b.textContent = '🔊 Read aloud'; b.disabled = false;
  });
  speakingRun = null;
}

async function speakReply(text, btn) {
  if (speakingRun && speakingRun.btn === btn) { stopSpeaking(); return; } // tap again = stop
  stopSpeaking(); // stop any other reply's speech first
  const seq = speakSeq;
  btn.disabled = true; btn.textContent = 'Loading voice…';
  const engine = await loadPhonon();
  if (seq !== speakSeq) { btn.disabled = false; btn.textContent = '🔊 Read aloud'; return; } // superseded
  const run = { cancelled: false, abort: new AbortController(), btn };
  speakingRun = run;
  btn.disabled = false; btn.classList.add('speaking'); btn.textContent = '■ Stop';
  try {
    if (engine && tts) await speakPhonon(text, run);
    else await speakDevice(text);
  } finally {
    if (speakingRun === run) {
      btn.classList.remove('speaking'); btn.textContent = '🔊 Read aloud';
      speakingRun = null;
    }
  }
}

// Load-attempt diagnostics: wllama's progress callback is the only window
// into the ~0.19 GB download, so remember the last numbers it reported.
let lastLoaded = 0;
let lastTotal = 0;
let loadStage = 'starting';

function fmtMB(n) { return (n / 1048576).toFixed(0) + ' MB'; }

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (!navigator.onLine) setStatus('Offline', 'loading');

// wllama 3.8.1 caches the model in OPFS under root 'cache/', keyed as
// SHA-1(url)_filename, plus a '__metadata__' + key file. A download that
// dies part-way leaves a partial file behind; wiping both entries forces
// a clean re-download instead of reusing the broken copy.
async function sha1Hex(str) {
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
async function clearModelCache() {
  if (!navigator.storage || !navigator.storage.getDirectory) {
    return 'This browser has no OPFS model cache to clear.';
  }
  const root = await navigator.storage.getDirectory();
  try {
    await root.removeEntry('cache', { recursive: true });
    return 'Model cache cleared (whole wllama cache folder removed).';
  } catch (e) {
    // Fallback: delete just this model's two entries.
    try {
      const fileKey = (await sha1Hex(MODEL_URL)) + '_' + MODEL_FILE;
      const dir = await root.getDirectoryHandle('cache');
      const removed = [];
      for (const k of [fileKey, '__metadata__' + fileKey]) {
        try { await dir.removeEntry(k); removed.push(k); } catch (_) { /* not present */ }
      }
      return removed.length
        ? 'Cleared cached model file(s).'
        : 'Nothing cached to clear (' + (e && e.message ? e.message : e) + ').';
    } catch (e2) {
      return 'Could not clear the cache: ' + (e2 && e2.message ? e2.message : e2);
    }
  }
}

async function loadModel(opts = {}) {
  if (wllama || loading) return;
  loading = true;
  loadStage = 'starting';
  lastLoaded = 0;
  lastTotal = 0;
  errorBox.style.display = 'none';
  retryRow.style.display = 'none';
  setStatus(opts.auto ? 'Loading saved model…' : 'Downloading model…', 'loading');
  progressWrap.style.display = 'block';
  progressBar.style.width = '0%';
  try {
    wllama = new Wllama(CONFIG_PATHS);
    await wllama.loadModelFromUrl(MODEL_URL, {
      n_threads: Math.max(1, navigator.hardwareConcurrency || 4),
      n_gpu_layers: 0, // WebGPU explicitly off — CPU/WASM only
      useCache: true,
      progressCallback: ({ loaded, total }) => {
        lastLoaded = loaded || 0;
        lastTotal = total || 0;
        if (total) {
          const pct = Math.round((loaded / total) * 100);
          loadStage = pct >= 100
            ? 'initializing (download done, loading into memory)'
            : 'downloading';
          progressBar.style.width = pct + '%';
          setStatus(`Downloading ${pct}% · ${fmtMB(loaded)} / ${fmtMB(total)}`, 'loading');
        }
      },
    });
    progressWrap.style.display = 'none';
    setStatus('Ready · works offline', 'ready');
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();
  } catch (err) {
    // The old code left `wllama` assigned after a failure, which made the
    // Download button a no-op (its handler returned early). Reset it so
    // Retry actually retries.
    wllama = null;
    console.error('Model load failed', { stage: loadStage, loaded: lastLoaded, total: lastTotal, online: navigator.onLine, err });
    const errName = (err && err.name) || 'Error';
    const errMsg = (err && err.message) || String(err);
    const pct = lastTotal ? Math.round((lastLoaded / lastTotal) * 100) : 0;
    const bytesLine = lastTotal
      ? `Downloaded: ${fmtMB(lastLoaded)} of ${fmtMB(lastTotal)} (${pct}%)`
      : (lastLoaded ? `Downloaded: ${fmtMB(lastLoaded)} (total size unknown)` : 'Downloaded: nothing arrived');
    let hint;
    if (lastLoaded > 0 && lastTotal && lastLoaded < lastTotal) {
      hint = 'What this means: the download stopped part-way — the connection dropped before the 0.19 GB file finished. The model file itself is fine; this is the mobile network. Tap “Retry download” — it starts again from the beginning, so Wi-Fi or a stronger signal helps.';
    } else if (lastLoaded >= lastTotal && lastTotal > 0) {
      hint = 'What this means: the download finished, but the model would not start in memory — the saved copy may be damaged. Tap “Clear cached model & retry”: it wipes the saved copy and downloads fresh.';
    } else {
      hint = 'What this means: nothing arrived from the model host — check your connection and tap “Retry download”. If it keeps failing at 0%, tap “Clear cached model & retry”.';
    }
    setStatus('Failed to load', 'error');
    errorBox.textContent =
      'Couldn’t load the model\n' +
      'Stage: ' + loadStage + '\n' +
      'Error: ' + errName + ': ' + errMsg + '\n' +
      bytesLine + '\n' +
      'Connection: ' + (navigator.onLine ? 'online' : 'offline (no connection)') + '\n' +
      hint;
    errorBox.style.display = 'block';
    retryRow.style.display = 'flex';
  } finally {
    loading = false;
  }
}

retryBtn.addEventListener('click', () => loadModel());
clearBtn.addEventListener('click', async () => {
  if (loading) return;
  retryBtn.disabled = true;
  clearBtn.disabled = true;
  setStatus('Clearing cached model…', 'loading');
  try {
    const result = await clearModelCache();
    showToast(result);
  } catch (e) {
    showToast('Could not clear the cache: ' + (e && e.message ? e.message : e));
  }
  retryBtn.disabled = false;
  clearBtn.disabled = false;

});

// Fully automatic on startup: if the model is cached, load it; if not,
// download it right away — no tap anywhere. The ~0.19 GB download starts
// on its own the first time the app opens. Both OPFS entries = a completed
// download; a partial download leaves the file without its metadata entry,
// so it re-downloads automatically too. If a download fails, the Retry
// buttons appear.
async function isModelCached() {
  if (!navigator.storage || !navigator.storage.getDirectory) return false;
  try {
    const root = await navigator.storage.getDirectory();
    const dir = await root.getDirectoryHandle('cache');
    const fileKey = (await sha1Hex(MODEL_URL)) + '_' + MODEL_FILE;
    await dir.getFileHandle(fileKey);
    await dir.getFileHandle('__metadata__' + fileKey);
    return true;
  } catch (e) {
    return false;
  }
}
setStatus('Checking saved model…', 'loading');
isModelCached().then((cached) => {
  loadModel({ auto: cached });
}).catch(() => { loadModel(); });

/* ---- Vision: Mirage 51M (Cactus engine, WASM) ---- */
// Mirage is NOT a GGUF model, so it cannot run in wllama. It runs on the
// Cactus engine (vendor/cactus/cactus.js + cactus.wasm, Apache 2.0 — see
// vendor/cactus/LICENSE-CACTUS.txt), which is a single-threaded WASM
// build: no SharedArrayBuffer, no Atomics, no pthreads, so it needs no
// COOP/COEP headers and works on plain GitHub Pages. The engine is loaded
// lazily on the first photo attach; mirage.cact (~22 MB) is fetched from
// this same origin and the service worker caches it, so vision works
// offline after the first use. describe() takes raw RGB pixels and
// returns a JSON record (scene, objects, OCR text, relations). That record
// is compacted to plain text and added to the chat history as a system
// message, so the MNN text model can answer questions about the photo
// without ever seeing pixels.
const MIRAGE_MODEL_URL = 'vendor/cactus/mirage.cact';
let cactusModule = null, cactusLoading = null, mirageReady = false, describing = false;

function loadCactusScript() {
  return new Promise((resolve, reject) => {
    if (window.createCactus) return resolve();
    // Classic script tag (not a module): cactus.js is UMD and declares
    // `var createCactus` at top level, which lands on window. It also
    // resolves cactus.wasm relative to its own URL (vendor/cactus/).
    const s = document.createElement('script');
    s.src = 'vendor/cactus/cactus.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('could not load vendor/cactus/cactus.js'));
    document.head.appendChild(s);
  });
}

function cactusError() {
  try {
    const p = cactusModule && cactusModule._cactus_last_error && cactusModule._cactus_last_error();
    return p ? readUtf8(p) : '';
  } catch (e) { return ''; }
}

// Plain-JS UTF-8 helpers: cactus.js does not export Emscripten's
// lengthBytesUTF8/stringToUTF8/UTF8ToString runtime methods, so work
// directly against HEAPU8 with TextEncoder/TextDecoder instead.
const utf8Encoder = new TextEncoder();
const utf8Decoder = new TextDecoder();
function readUtf8(ptr) {
  if (!ptr) return '';
  const heap = cactusModule.HEAPU8;
  let end = ptr;
  while (heap[end] !== 0) end++;
  return utf8Decoder.decode(heap.subarray(ptr, end));
}

function mallocBytes(bytes) {
  const ptr = cactusModule._malloc(bytes.length);
  if (!ptr) throw new Error('out of memory in the vision engine');
  cactusModule.HEAPU8.set(bytes, ptr);
  return ptr;
}
function mallocString(str) {
  const bytes = utf8Encoder.encode(str);
  const ptr = cactusModule._malloc(bytes.length + 1);
  if (!ptr) throw new Error('out of memory in the vision engine');
  cactusModule.HEAPU8.set(bytes, ptr);
  cactusModule.HEAPU8[ptr + bytes.length] = 0;
  return ptr;
}

async function loadMirage() {
  if (mirageReady) return true;
  if (cactusLoading) return cactusLoading;
  cactusLoading = (async () => {
    showToast('Loading vision model (Mirage, ~22 MB, one-time)…');
    await loadCactusScript();
    cactusModule = await window.createCactus();
    const res = await fetch(MIRAGE_MODEL_URL);
    if (!res.ok) throw new Error('could not fetch ' + MIRAGE_MODEL_URL + ' (HTTP ' + res.status + ')');
    const bytes = new Uint8Array(await res.arrayBuffer());
    const ptr = mallocBytes(bytes);
    try {
      const rc = cactusModule._cactus_load(ptr, BigInt(bytes.length)); // size is unsigned long long (i64) in cactus.h — Emscripten needs a BigInt
      if (rc < 0) throw new Error('cactus_load failed: ' + cactusError());
      if ((cactusModule._cactus_models() & 4) === 0) throw new Error('Mirage did not register as a vision model');
    } finally {
      cactusModule._free(ptr);
    }
    mirageReady = true;
    return true;
  })().catch((e) => {
    cactusLoading = null;
    console.error('Mirage load failed', e);
    throw e;
  });
  return cactusLoading;
}

// Decode an image file to RGB bytes (longest side capped at 1024 px —
// the encoder works on 256 image cells, so more pixels add nothing).
// imageOrientation 'from-image' honours phone EXIF rotation.
// FIX: iPhone photos are often HEIC, which createImageBitmap rejects in
// some browsers — fall back to an <img> decode via object URL.
async function imageToRGB(file) {
  let bitmap = null;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((resolve, reject) => {
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = () => reject(new Error('could not decode this image — try a JPG or PNG'));
        im.src = url;
      });
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      const data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
      const rgb = new Uint8Array(canvas.width * canvas.height * 3);
      for (let i = 0, j = 0; i < data.length; i += 4, j += 3) {
        rgb[j] = data[i]; rgb[j + 1] = data[i + 1]; rgb[j + 2] = data[i + 2];
      }
      return { rgb, width: canvas.width, height: canvas.height };
    } finally {
      URL.revokeObjectURL(url);
    }
  }
  const scale = Math.min(1, 1024 / Math.max(bitmap.width, bitmap.height));
  const w = Math.max(1, Math.round(bitmap.width * scale));
  const h = Math.max(1, Math.round(bitmap.height * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;
  const rgb = new Uint8Array(w * h * 3);
  for (let i = 0, j = 0; i < data.length; i += 4, j += 3) {
    rgb[j] = data[i]; rgb[j + 1] = data[i + 1]; rgb[j + 2] = data[i + 2];
  }
  bitmap.close();
  return { rgb, width: w, height: h };
}

// Compact the Mirage JSON to short plain text: masks and the reasoning
// trace are dropped (the trace showed no VQA benefit in Cactus's own
// test), objects capped at 15, text lines at 10, relations at 10.
function compactMirageRecord(rec) {
  const lines = [];
  // Real schema (verified by running describe() locally, Nov 14):
  // scene is an OBJECT {background, style, ...}, NOT a string.
  const sc = rec.scene;
  if (sc && typeof sc === 'object') {
    const bits = Object.values(sc).filter((v) => typeof v === 'string' && v.trim());
    if (bits.length) lines.push('Scene: ' + bits.join(', '));
  } else if (typeof sc === 'string' && sc.trim()) lines.push('Scene: ' + sc.trim());
  const allObjs = Array.isArray(rec.objects) ? rec.objects : [];
  const byId = {};
  allObjs.forEach((o) => { if (o && o.id != null) byId[o.id] = o; });
  const objs = allObjs.slice(0, 15);
  if (objs.length) {
    lines.push('Objects: ' + objs.map((o) => {
      const name = o.name || o.label || 'thing';
      // description is an OBJECT {color, shape, content, direction, ...}
      const d = (o.description && typeof o.description === 'object') ? o.description : {};
      const attrs = [d.color, d.material, d.shape, d.direction, d.content]
        .filter((v) => typeof v === 'string' && v.trim()).join(', ');
      const b = o.bbox || o.box;
      const box = Array.isArray(b) ? ' [' + b.map((v) => Math.round(v)).join(',') + ']' : '';
      const pos = (typeof o.position === 'string' && o.position) ? ' at ' + o.position : '';
      return name + (attrs ? ' (' + attrs + ')' : '') + box + pos;
    }).join('; '));
  }
  const texts = [];
  const pushText = (t) => {
    if (typeof t === 'string' && t.trim()) texts.push(t.trim());
    // OCR entries use `string`, not `text`
    else if (t && typeof t.string === 'string' && t.string.trim()) texts.push(t.string.trim());
    else if (t && typeof t.text === 'string' && t.text.trim()) texts.push(t.text.trim());
  };
  if (Array.isArray(rec.text)) rec.text.forEach(pushText);
  if (Array.isArray(rec.text_lines)) rec.text_lines.forEach(pushText);
  if (typeof rec.text === 'string') pushText(rec.text);
  if (texts.length) lines.push('Text in image: ' + texts.slice(0, 10).map((t) => '"' + t + '"').join(', '));
  // Relations reference objects by numeric id — resolve to names.
  const rels = Array.isArray(rec.relations) ? rec.relations.slice(0, 10) : [];
  if (rels.length) {
    lines.push('Relations: ' + rels.map((r) => {
      if (typeof r === 'string') return r;
      const sName = (r.subject != null && byId[r.subject]) ? (byId[r.subject].name || 'thing') : r.subject;
      const oName = (r.object != null && byId[r.object]) ? (byId[r.object].name || 'thing') : r.object;
      return [sName, r.predicate || r.relation, oName].filter((v) => v != null && v !== '').join(' ');
    }).join('; '));
  }
  return lines.join('\n');
}

// Short spoken-style summary of the record for the chat bubble.
function summarizeRecord(rec) {
  const objs = Array.isArray(rec.objects) ? rec.objects : [];
  const bits = objs.slice(0, 8).map((o) => {
    const d = (o.description && typeof o.description === 'object') ? o.description : {};
    const label = [d.color, o.name].filter((v) => typeof v === 'string' && v.trim()).join(' ');
    return label || (o.name || 'thing');
  });
  const texts = [];
  if (Array.isArray(rec.text)) rec.text.forEach((t) => {
    if (t && typeof t.string === 'string' && t.string.trim()) texts.push(t.string.trim());
  });
  texts.slice(0, 3).forEach((t) => bits.push('text reading "' + t + '"'));
  return bits.length
    ? 'I see ' + bits.join(', ') + '.'
    : 'I looked at the photo but could not describe it.';
}

async function describePhoto(file) {
  await loadMirage();
  showToast('Mirage is looking at the photo…');
  const { rgb, width, height } = await imageToRGB(file);
  const outCap = 262144; // 256 KB JSON buffer
  const rgbPtr = mallocBytes(rgb);
  const optPtr = mallocString('{}'); // defaults: full record (scene, objects, text, relations)
  const langPtr = mallocString('en');
  const outPtr = cactusModule._malloc(outCap);
  if (!outPtr) throw new Error('out of memory in the vision engine');
  try {
    const rc = cactusModule._cactus_describe(rgbPtr, width, height, optPtr, langPtr, 0, outPtr, outCap);
    if (rc < 0) throw new Error('cactus_describe failed: ' + cactusError());
    return JSON.parse(readUtf8(outPtr));
  } finally {
    cactusModule._free(rgbPtr); cactusModule._free(optPtr);
    cactusModule._free(langPtr); cactusModule._free(outPtr);
  }
}

function addPhotoMsg(file, caption) {
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'row user';
  const b = document.createElement('div');
  b.className = 'bubble';
  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);
  img.alt = 'Attached photo';
  b.appendChild(img);
  const cap = document.createElement('div');
  cap.textContent = caption;
  b.appendChild(cap);
  row.appendChild(b);
  chatCol.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return row;
}

async function onPhotoPicked(file) {
  if (!file || !file.type.startsWith('image/') || describing) return;
  describing = true;
  try {
    const rec = await describePhoto(file);
    const compact = compactMirageRecord(rec);
    const summary = summarizeRecord(rec);
    addPhotoMsg(file, '📷 Photo attached');
    const { body } = addAssistantMsg(summary);
    attachReplyActions(body, summary);
    if (compact) {
      history.push({ role: 'system', content: 'The user shared a photo. Mirage (vision model) produced this structured record of it — use ONLY this record to answer questions about the photo; if a detail is not in the record, say you cannot see it:\n' + compact });
    }
    showToast('Photo described. Ask anything about it.');
  } catch (e) {
    console.error('Photo describe failed', e);
    const { body } = addAssistantMsg('I could not look at that photo: ' + (e && e.message ? e.message : e));
    attachReplyActions(body, 'I could not look at that photo.');
    showToast('Vision failed: ' + (e && e.message ? e.message : e));
  } finally {
    describing = false;
  }
}

const photoBtn = document.getElementById('photoBtn');
const photoInput = document.getElementById('photoInput');
photoBtn.addEventListener('click', () => photoInput.click());
photoInput.addEventListener('change', () => { onPhotoPicked(photoInput.files[0]); photoInput.value = ''; });

/* ---- Generation (shared by send + regenerate) ---- */
// FIX: the 0.3B model has a small context window. Sending the whole
// ever-growing `history` (incl. every photo record) blows it up and makes
// replies ramble. Only the last 2 photo records + last 6 turns go in.
function modelMessages() {
  const sys = history[0];
  const rest = history.slice(1);
  const photos = rest.filter((m) => m.role === 'system');
  const turns = rest.filter((m) => m.role !== 'system').slice(-12);
  return [sys, ...photos.slice(-2), ...turns];
}

async function runGeneration(userText) {
  generating = true;
  stopRequested = false;
  sendBtn.disabled = false; // stays clickable as the Stop button
  sendBtn.classList.add('stop');
  sendBtn.textContent = '■';
  sendBtn.setAttribute('aria-label', 'Stop generating');
  inputEl.disabled = true;
  const { row, body, textEl } = addAssistantMsg('');
  const caret = document.createElement('span');
  caret.className = 'caret';
  const t0 = performance.now();
  let tokens = 0;
  let raw = '';
  try {
    const stream = await wllama.createChatCompletion({
      messages: modelMessages(),
      max_tokens: 512,
      temperature: 0.7,
      stream: true,
    });
    for await (const chunk of stream) {
      if (stopRequested) break; // breaking the iterator stops consuming; the engine may finish its current step in the background.
      const piece = chunk.choices[0]?.delta?.content ?? chunk.choices[0]?.text ?? '';
      if (piece) {
        tokens++;
        raw += piece;
        textEl.innerHTML = renderMarkdown(raw);
        textEl.appendChild(caret);
        scrollIfNearBottom();
      }
    }
    if (stopRequested && !raw) raw = 'Stopped.';
    if (stopRequested && raw && raw !== 'Stopped.') raw += '\n\n*(Stopped.)*';
  } catch (err) {
    console.error(err);
    raw = 'Error: ' + (err && err.message ? err.message : err);
  }
  caret.remove();
  textEl.innerHTML = renderMarkdown(raw);
  history.push({ role: 'assistant', content: raw });
  savedMsgs.push({ role: 'assistant', text: raw });
  saveChat();
  const secs = (performance.now() - t0) / 1000;
  const { meta, speakBtn } = attachReplyActions(body, raw);
  meta.textContent = stopRequested
    ? `${tokens} tokens · stopped`
    : `${tokens} tokens in ${secs.toFixed(1)}s${secs > 0 ? ` (${(tokens / secs).toFixed(1)} tok/s, CPU/WASM)` : ' (CPU/WASM)'}`;
  if (voiceAuto && !stopRequested) speakReply(raw, speakBtn); // Voice on: read every reply aloud
  generating = false;
  stopRequested = false;
  sendBtn.classList.remove('stop');
  sendBtn.textContent = '↑';
  sendBtn.setAttribute('aria-label', 'Send');
  sendBtn.disabled = false;
  inputEl.disabled = false;
  inputEl.focus();
  scrollIfNearBottom();
}

async function regenerateLast() {
  if (!wllama || generating) return;
  // Find the last user turn, drop the last assistant reply (DOM + history + saved).
  let lastUserIdx = -1;
  for (let i = history.length - 1; i >= 0; i--) {
    if (history[i].role === 'user') { lastUserIdx = i; break; }
  }
  if (lastUserIdx < 0) { showToast('Nothing to regenerate yet.'); return; }
  const userText = history[lastUserIdx].content;
  const rows = chatCol.querySelectorAll('.row.assistant');
  if (rows.length) rows[rows.length - 1].remove();
  history.length = lastUserIdx + 1; // drop the assistant reply after that user turn
  const savedIdx = savedMsgs.map((m) => m.role).lastIndexOf('assistant');
  if (savedIdx >= 0) savedMsgs.splice(savedIdx, 1);
  saveChat();
  await runGeneration(userText);
}

document.getElementById('chatForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (generating) { stopRequested = true; return; } // send button is Stop while generating
  if (!wllama) return;
  if (describing) { showToast('Still looking at the photo — one moment…'); return; }
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  autoGrow();
  addUserMsg(text);
  history.push({ role: 'user', content: text });
  savedMsgs.push({ role: 'user', text });
  saveChat();
  await runGeneration(text);
});
</script>
